[project]
name = "policy-validator"
version = "0.1.0"
description = "Classifies expense receipt line items and checks them against written policies with a deterministic rule engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "openai>=1.50",
    "pandas>=2.3.3",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "scikit-learn>=1.7.2",
    "streamlit>=1.38",
]

[project.scripts]
validator = "policy_validator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_validator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
